name: Pruebas Automaticas

on:
  push:
    branches:
      - main
      - develop
      - release

jobs:
  testear-codigo:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Codigo
        uses: actions/checkout@v5
        with:
          python-version: '3.11'
      - name: Instalar Dependencias
        run: pip install pytest
      
      - name: Ejecutar Pruebas
        run: pytest test_app.py
        

